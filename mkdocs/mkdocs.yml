site_name: 3D Print Models
site_description: Personal catalog of 3D printable models — originals and remixes.
site_url: https://zeroexgit.github.io/3d-print-models/
repo_url: https://github.com/zeroexgit/3d-print-models
repo_name: zeroexgit/3d-print-models

docs_dir: ..
site_dir: /tmp/mkdocs_site

hooks:
  - hooks.py

plugins:
  - search
  - glightbox # Better image previewing and lightbox support

theme:
  name: material
  logo: assets/ZeroEx_BWA.png
  favicon: assets/ZeroEx_BWA.png
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

exclude_docs: |
  *.3mf
  *.stl
  */original/
  */photos/
  .git/
  .github/
  .gitignore
  AGENTS.md
  mkdocs/
  models/.gitignore
  models/model_readme_template.md

extra_css:
  - assets/extra.css
